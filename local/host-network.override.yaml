# Host-specific: workaround for the broken /0 prefix on wlp4s0.
#
# `ip addr show wlp4s0` shows 10.0.10.167/0. From netavark's perspective, this
# interface "occupies" the entire IPv4 space, and `podman network create`
# fails with "could not find free subnet from subnet pools".
#
# This overlay makes the task run in the host network so Compose does not need
# to create its own bridge network. Intended for local testing only.
services:
  main:
    network_mode: host
